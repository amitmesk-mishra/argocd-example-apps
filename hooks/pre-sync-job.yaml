apiVersion: batch/v1
kind: Job

metadata:
  name: db-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation


spec:
  template:
    spec:
      containers:
        - name: db-migrate
          image: alpine:3.20
          command: ["sh", "-c", "sleep 5"]

      restartPolicy: Never

  backoffLimit: 0

